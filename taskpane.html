<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equation Grapher</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  :root { --fg:#201f1e; --muted:#605e5c; --line:#d2d0ce; --accent:#7719aa; --bg:#fff; }
  * { box-sizing: border-box; }
  body { margin:0; padding:12px; font:14px/1.4 "Segoe UI", system-ui, sans-serif; color:var(--fg); background:var(--bg); }
  h1 { font-size:16px; margin:0 0 8px; }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 3px; }
  textarea { width:100%; min-height:72px; resize:vertical; font:14px Consolas, monospace; padding:6px; border:1px solid var(--line); border-radius:4px; }
  .row { display:flex; gap:6px; }
  .row > div { flex:1; }
  input[type=number] { width:100%; padding:4px; border:1px solid var(--line); border-radius:4px; }
  button { padding:6px 10px; border:1px solid var(--line); background:#f3f2f1; border-radius:4px; cursor:pointer; font:inherit; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:hover { filter:brightness(.95); }
  .buttons { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  canvas { width:100%; height:auto; border:1px solid var(--line); border-radius:4px; margin-top:10px; touch-action:none; cursor:grab; display:block; }
  canvas.dragging { cursor:grabbing; }
  #errors { color:#a4262c; font-size:12px; min-height:16px; margin-top:6px; white-space:pre-wrap; }
  #status { color:var(--muted); font-size:12px; margin-top:6px; min-height:16px; }
  .hint { color:var(--muted); font-size:11px; margin-top:6px; }
  .legend span { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:middle; }
</style>
</head>
<body>
  <h1>Equation Grapher</h1>

  <label for="eqs">Equations (one per line, as y = f(x))</label>
  <textarea id="eqs" spellcheck="false">y = x^2 - 2
y = sin(x)*3</textarea>
  <div id="errors"></div>

  <div class="row">
    <div><label>x min</label><input type="number" id="xmin" value="-10" step="any"></div>
    <div><label>x max</label><input type="number" id="xmax" value="10" step="any"></div>
  </div>
  <div class="row">
    <div><label>y min</label><input type="number" id="ymin" value="-7" step="any"></div>
    <div><label>y max</label><input type="number" id="ymax" value="7" step="any"></div>
  </div>

  <canvas id="cv" width="720" height="480"></canvas>
  <div class="hint">Drag to move, scroll to zoom. Supports + - * / ^, 2x, sin cos tan sqrt abs ln log exp, pi, e, |x|.</div>

  <div class="buttons">
    <button class="primary" id="insert">Insert in page</button>
    <button id="copy">Copy image</button>
    <button id="save">Download PNG</button>
    <button id="reset">Reset view</button>
  </div>
  <div id="status"></div>

<script src="parser.js"></script>
<script src="grapher.js"></script>
</body>
</html>
